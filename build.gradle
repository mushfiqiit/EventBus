buildscript {
    ext {
        _compileSdkVersion = 30 // Android 11 (R)
    }
    repositories {
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath "io.github.gradle-nexus:publish-plugin:1.1.0"
    }
}

// Set group and version in root build.gradle so publish-plugin can detect them.
group = "org.greenrobot"
version = "3.3.1"

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

if (JavaVersion.current().isJava8Compatible()) {
    allprojects {
        tasks.withType(Javadoc) {
            options.addStringOption('Xdoclint:none', '-quiet')
        }
    }
}

wrapper {
    distributionType = Wrapper.DistributionType.ALL
}

// Runs the NullAway nullability check across the modules it's configured on
// (see gradle/nullaway.gradle). Findings are printed as compiler warnings.
task nullAwayCheck {
    group = "verification"
    description = "Runs the NullAway nullability checker on eventbus-java and eventbus-annotation-processor."
    dependsOn ":eventbus-java:compileJava", ":eventbus-annotation-processor:compileJava"
}

// Plugin to publish to Central https://github.com/gradle-nexus/publish-plugin/
// This plugin ensures a separate, named staging repo is created for each build when publishing.
apply plugin: "io.github.gradle-nexus.publish-plugin"
nexusPublishing {
    repositories {
        sonatype {
            if (project.hasProperty("sonatypeUsername") && project.hasProperty("sonatypePassword")) {
                println('nexusPublishing credentials supplied.')
                username = sonatypeUsername
                password = sonatypePassword
            } else {
                println('nexusPublishing credentials NOT supplied.')
            }
        }
    }
}
